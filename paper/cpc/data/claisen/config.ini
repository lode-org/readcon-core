[Main]
job = nudged_elastic_band
random_seed = 1

[Potential]
potential = metatomic

[Metatomic]
model_path = pet-mad-s-v1.1.0.pt
device = cpu
deterministic = true

[Nudged Elastic Band]
images = 24
spring = 5.0
climbing_image_method = true
climbing_image_converged_only = false
ci_mmf = false
minimize_endpoints = false
converged_force = 0.05
max_iterations = 3000
initializer = file
opt_method = lbfgs
max_move = 0.008

[Optimizer]
opt_method = lbfgs
convergence_metric = max_atom
converged_force = 0.05
max_iterations = 3000
max_move = 0.008
