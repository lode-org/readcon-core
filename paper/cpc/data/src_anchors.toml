# Source ranges the paper cites. scripts/src_anchors.py resolves each anchor
# in the tree it runs in and writes src/figures/generated/anchors_macros.tex;
# --check fails when an anchor no longer matches exactly one line.

[read_gzip]
file = "src/compression.rs"
fn = "read_decoded"
start = 'Compression::Gzip => \{'
end = "block"

[read_zstd]
file = "src/compression.rs"
fn = "read_decoded"
start = 'Compression::Zstd => \{'
end = "block"

[read_plain]
file = "src/compression.rs"
start = 'Compression::None if metadata\.len\(\) < MMAP_THRESHOLD'
end = 'FileContents::Mapped\(mmap\)'

[thread_choice]
file = "src/iterators.rs"
start = '^pub fn frames_from_bytes'
end = "block"

[boundary_walk]
file = "src/iterators.rs"
start = '^fn frame_boundaries'
end = "block"

[parallel_parse]
file = "src/iterators.rs"
parts = [
  { start = '^fn parse_frames_parallel_bytes', end = "block" },
  { start = '^fn drain_chunk', end = "block" },
]

[read_indexed]
file = "src/iterators.rs"
start = '^pub fn read_all_frames_indexed'
end = "block"

[trajectory_open]
file = "src/trajectory.rs"
start = '^\s*pub fn open\(path: &Path, write_index: bool\)'
end = "block"

[header_line_two]
file = "src/parser.rs"
fn = "parse_frame_header_at"
parts = [
  { start = 'if reject_leading_bom && prebox1\.starts_with', end = "block" },
  { start = 'trim_field_ws\(json_text\)\.starts_with\(.\{.\)' },
]

[header_check]
file = "src/parser.rs"
start = '^pub\(crate\) fn parse_frame_header_at'
end = "block"

[frame_body]
file = "src/parser.rs"
start = '^pub\(crate\) fn parse_single_frame_ls'
end = "block"

[coordinate_rows]
file = "src/parser.rs"
start = '^fn ingest_coord_rows'
end = "block"

[finite_number]
file = "src/parser.rs"
parts = [
  { start = '^fn parse_finite_float_token', end = "block" },
  { start = '^fn parse_fixed_flag', end = "block" },
]

[real_cell]
file = "src/parser.rs"
start = '^fn ensure_real_cell'
end = "block"

[legacy_velocity]
file = "src/iterators.rs"
start = '^pub\(crate\) fn probe_legacy_velocities'
end = "block"

[declared_sections]
file = "src/parser.rs"
parts = [
  { start = '^pub fn parse_declared_sections', end = "block" },
  { start = '^pub\(crate\) fn skip_unknown_section', end = "block" },
]

[velocity_time]
file = "src/parser.rs"
parts = [
  { start = '^pub\(crate\) fn reject_velocities_without_time', end = "block" },
  { start = '^pub\(crate\) fn require_velocity_time', end = "block" },
]

[replace_file]
file = "src/replace_file.rs"
parts = [
  { start = '^\s*fn open\(dst: &Path, initial: u8\)', end = "block" },
  { start = '^\s*pub\(crate\) fn publish\(&mut self\)', end = "block" },
  { start = '^impl Drop for ReplacingFile', end = "block" },
]

[rcbin_copy]
file = "src/soa_traj.rs"
parts = [
  { start = '^fn rcbin_layout', end = "block" },
  { start = '^pub fn read_rcbin_into', end = "block" },
]

[rcbin_crc]
file = "src/soa_traj.rs"
parts = [
  { start = '^pub fn checksum_rcbin_mmap', end = "block" },
  { start = '^pub fn read_rcbin_bytes', end = "block" },
]
