# Phase A CON conformance corpus.
# Each [[valid]] / [[invalid]] table is one fixture keyed to a spec.org clause.
# tests/conformance_corpus.rs reads this file.
# Language locks: tests/python/test_conformance_goldens.py,
# tests/c/test_conformance_goldens.c, fortran/ReadCon/test_conformance/,
# julia/ReadCon/test/test_conformance_goldens.jl.

phase = "A"
spec = "docs/orgmode/spec.org"

[[valid]]
id = "v2-minimal"
path = "valid/v2_minimal.con"
clause = "Line 2: Metadata"
clauses = [
  "CON-status.2",
  "CON-line2.1",
  "CON-line2.4",
  "CON-line2.10",
  "CON-header.1",
]
notes = "Minimal v2 JSON metadata with con_spec_version."

[[valid]]
id = "v3-units"
path = "valid/v3_units.con"
clause = "Units (required)"
clauses = ["CON-units.1", "CON-line2.10"]
notes = "v3 with required length and energy units."

[[valid]]
id = "column-4-spec2-x-only"
path = "valid/column4_spec2_x_only.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.4"]
expect_fixed = [true, false, false]
notes = "Spec 2+ column 4 value 1 is x-only."

[[valid]]
id = "column-4-spec1-all-fixed"
path = "valid/column4_spec1_all_fixed.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.2"]
expect_fixed = [true, true, true]
notes = "Spec 1 column 4 value 1 is all-fixed."

[[valid]]
id = "column-4-spec2-all-fixed"
path = "valid/column4_spec2_all_fixed.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.7"]
expect_fixed = [true, true, true]
notes = "Spec 2+ column 4 value 7 is all-fixed."

[[valid]]
id = "column-4-spec2-y-only"
path = "valid/column4_spec2_y_only.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.4"]
expect_fixed = [false, true, false]
notes = "Spec 2+ column 4 value 2 is y-only."

[[valid]]
id = "column-4-spec2-xz"
path = "valid/column4_spec2_xz.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.4"]
expect_fixed = [true, false, true]
notes = "Spec 2+ column 4 value 5 is x+z."

[[valid]]
id = "zero-atom"
path = "valid/zero_atom.con"
clause = "legal zero-atom frame"
clauses = ["CON-count.1", "CON-count.2", "CON-count.5"]
notes = "Type count 0 with whitespace lines 8 and 9."

[[valid]]
id = "zero-atom-eof"
path = "valid/zero_atom_eof.con"
clause = "legal zero-atom frame"
clauses = ["CON-count.4"]
notes = "Type count 0 at end of file with lines 8 and 9 absent."

[[valid]]
id = "zero-atom-then-frame"
path = "valid/zero_atom_then_frame.con"
clause = "legal zero-atom frame"
clauses = ["CON-count.1", "CON-frame.7"]
notes = "A zero-atom frame with lines 8 and 9, then one normal frame."

[[invalid]]
id = "missing-spec-version"
path = "invalid/missing_spec_version.con"
clause = "Line 2: Metadata"
clauses = ["CON-line2.3", "CON-error.1", "CON-error.2"]
error = "MissingSpecVersion"
notes = "JSON object on line 2 without con_spec_version."

[[invalid]]
id = "v3-missing-units"
path = "invalid/v3_missing_units.con"
clause = "Units (required)"
clauses = ["CON-units.1"]
error = "InvalidUnits"
notes = "con_spec_version 3 without units."

[[invalid]]
id = "v3-bad-units"
path = "invalid/v3_bad_units.con"
clause = "Units (required)"
clauses = ["CON-units.13"]
error = "InvalidUnits"
notes = "v3 units with swapped length/energy dimensions."

[[invalid]]
id = "column-4-out-of-range"
path = "invalid/column4_out_of_range.con"
clause = "Per-direction constraints (column 4)"
clauses = ["CON-mask.5"]
error = "InvalidFixedFlag"
notes = "column 4 value 8 is InvalidFixedFlag in every mode, including validate=true."

[[invalid]]
id = "unsupported-spec-version"
path = "invalid/unsupported_spec_version.con"
clause = "Line 2: Metadata"
clauses = ["CON-line2.6"]
error = "UnsupportedVersion"
notes = "con_spec_version 4 exceeds CON_SPEC_VERSION."

[[invalid]]
id = "unknown-section"
path = "invalid/unknown_section.con"
clause = "Section declaration"
clauses = ["CON-section.7"]
error = "UnknownSection"
notes = "Declared section name is not a reserved section."

[[invalid]]
id = "validate-true-missing-sections"
