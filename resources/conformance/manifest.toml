path = "valid/v31_velocity_s.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time s."

[[valid]]
id = "v31-velocity-second"
path = "valid/v31_velocity_second.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time second."

[[valid]]
id = "v31-velocity-fs"
path = "valid/v31_velocity_fs.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time fs."

[[valid]]
id = "v31-velocity-femtosecond"
path = "valid/v31_velocity_femtosecond.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time femtosecond."

[[valid]]
id = "v31-velocity-ps"
path = "valid/v31_velocity_ps.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time ps."

[[valid]]
id = "v31-velocity-picosecond"
path = "valid/v31_velocity_picosecond.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time picosecond."

[[valid]]
id = "v31-velocity-ns"
path = "valid/v31_velocity_ns.con"
clause = "Units (required)"
notes = "CON 3.1 velocities with units.time ns."

[[valid]]
id = "v31-velocity-nanosecond"
path = "valid/v31_velocity_nanosecond.con"
