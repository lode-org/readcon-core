[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.28) — generates .github/workflows/release.yml
# Release PR workflow: open a PR with the version bump; CI runs `dist plan` on the
# PR (validation). After merge, push a signed `vX.Y.Z` tag to publish artifacts
# and the GitHub Release. crates.io is handled by crates_publish.yml (uses
# CARGO_REGISTRY_TOKEN). PyPI wheels remain python_wheels.yml on the same tag.
[dist]
cargo-dist-version = "0.28.0"
ci = "github"
# Run plan (and optional artifact upload) on every PR so release PRs are checked
# before the tag is cut.
pr-run-mode = "plan"
installers = []
# cargo-dist 0.28 ships the CLI binary archives (main.rs) only. It has
# no cargo-c / C ABI prefix artifact type, so this file does not try to
# force shared-library archives through dist. Prebuilt C ABI tarballs
# (readcon-core-clib-$VERSION-$TARGET.tar.gz: libreadcon_core, headers,
# pkg-config) are attached by the sibling workflow c_lib_tarball.yml
# after the GitHub Release is published, the same split as the cxx
# source tarballs (readcon-core-cxx-$VERSION.tar.gz via cxx_tarball.yml).
# Local cargo-c remains a third install path; cbindgen is not required.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
github-releases = true
# Create GitHub releases from the tag; PR mode only plans.
create-release = true
