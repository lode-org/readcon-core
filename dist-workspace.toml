[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.28) — generates .github/workflows/release.yml
# Release PR workflow: open a PR with the version bump; CI runs `dist plan` on the
# PR (validation). After merge, push a signed `vX.Y.Z` tag to publish artifacts
# and the GitHub Release. crates.io is handled by crates_publish.yml (uses
# CARGO_REGISTRY_TOKEN). PyPI wheels remain python_wheels.yml on the same tag.
[dist]
cargo-dist-version = "0.28.0"
ci = "github"
# release.yml is hand-patched after generate (action SHA pins, the checksummed
# dist installer, and the rustup-init pin). dist plan must not reject that.
allow-dirty = ["ci"]
# Run plan (and optional artifact upload) on every PR so release PRs are checked
# before the tag is cut.
pr-run-mode = "plan"
installers = []
# CLI binary archives (main.rs). C/C++ source tarballs
# (readcon-core-cxx-$VERSION.tar.gz) are attached by cxx_tarball.yml
# after the GitHub Release is published. Prebuilt C ABI prefixes
# (readcon-core-clib-$VERSION-$target.tar.gz) are attached by
# c_lib_tarball.yml. cargo-dist 0.28 does not emit a cargo-c prefix.
# cbindgen is not required.
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
github-releases = true
# Create GitHub releases from the tag; PR mode only plans.
create-release = true

# cargo-dist 0.28.0 defaults are ubuntu-20.04 (global and Linux), macos-13,
# and windows-2019. GitHub retired those images, so every job and target is
# pinned to a current runner here. `global` covers plan, build-global-artifacts,
# host, and announce. Linux stays on 22.04 (glibc 2.35), the oldest image
# GitHub still hosts, rather than a manylinux container: the checksummed dist
# 0.28.0 binary needs glibc 2.29, so manylinux_2_28 cannot run it, and an
# ubuntu:20.04 container would need extra packages the generated job does not
# install before rustup.
[dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-apple-darwin = "macos-15-intel"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
