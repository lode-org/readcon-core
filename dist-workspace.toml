[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.28) — generates .github/workflows/release.yml
# Release PR workflow: open a PR with the version bump; CI runs `dist plan` on the
# PR (validation). After merge, push a signed `vX.Y.Z` tag to publish artifacts
# and the GitHub Release. crates.io is handled by crates_publish.yml (uses
# CARGO_REGISTRY_TOKEN). PyPI wheels remain python_wheels.yml on the same tag.
[dist]
cargo-dist-version = "0.28.0"
ci = "github"
# Run plan (and optional artifact upload) on every PR so release PRs are checked
# before the tag is cut.
pr-run-mode = "plan"
installers = []
# CLI binary archives (main.rs) only.
#
# cargo-dist 0.28 (package-libraries since 0.20) can put a cdylib next
# to that CLI binary. It does not emit a cargo-c prefix: no include/,
# no lib/pkgconfig/readcon-core.pc, no SONAME/pc filename from
# [package.metadata.capi.*]. Do not enable package-libraries here;
# that would pretend the C ABI is a dist artifact.
#
# C/C++ source tarballs (readcon-core-cxx-$VERSION.tar.gz) are attached
# by cxx_tarball.yml. Prebuilt C prefixes
# (readcon-core-clib-$VERSION-$target.tar.gz) are attached by
# c_lib_tarball.yml (cargo cinstall --library-type cdylib). cbindgen
# is not required.
# package-libraries = ["cdylib"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
github-releases = true
# Create GitHub releases from the tag; PR mode only plans.
create-release = true
