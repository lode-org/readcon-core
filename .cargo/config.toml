# chemfiles-sys vendors an older CMakeLists that still declares
# cmake_minimum_required(< 3.5). Modern CMake rejects that unless
# CMAKE_POLICY_VERSION_MINIMUM is set; export it for all cargo builds
# that pull the optional `chemfiles` feature.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
# /usr/bin/c++ is clang on some images. chemfiles-sys and zstd-sys forward
# the Rust target triple as --target, and that clang link does not search
# the host libstdc++. g++ does.
CC = "gcc"
CXX = "g++"
