[tool.towncrier]
name = "readcon-core"
package = "readcon_meta"
package_dir = "."
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## v{version} - {project_date}"
underlines = ["", "", ""]
wrap = true
all_bullets = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
