[package]
name = "readcon-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
readcon-core = { path = "..", features = ["parallel", "grammar", "zstd", "chemfiles-from-sources"] }
serde_json = "1"
tempfile = "3"

