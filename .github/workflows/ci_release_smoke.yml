name: Release smoke

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose published assets to smoke
        required: true
        type: string

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  published-assets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Compilers for the C and C++ smoke programs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Reject a clib tarball that omits the version header
        run: python3 scripts/check_release_smoke.py --self-test

      - name: Download the published assets for this version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMOKE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          # The worktree is the workflow ref. Its wrap describes the next
          # unreleased tree. Pins come from the tag being smoked.
          require=0
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$SMOKE_TAG"
            require=1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            require=1
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          if ! git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"; then
            if [ "$require" = 1 ]; then
              echo "tag ${tag} is not on origin" >&2
              exit 1
            fi
            echo "${tag} is not published yet"
            exit 0
          fi
          args=(--tag "$tag")
          if [ "$require" = 1 ]; then
            args+=(--require-published)
          fi
          python3 scripts/check_release_smoke.py "${args[@]}"

  install-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install the documented commands
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            args+=(--require-published)
          fi
          python3 scripts/check_install_docs.py "${args[@]}"
