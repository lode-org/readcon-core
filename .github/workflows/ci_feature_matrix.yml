name: Feature matrix (C ABI)

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - capi,chemfiles-from-sources
          - capi,chemfiles-from-sources,zstd
          - capi,chemfiles-from-sources,metatensor
          - capi,chemfiles-from-sources,zstd,metatensor
          - capi,grammar
          - capi,chemfiles-from-sources,grammar
          - capi,parallel
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + symbol/header matrix
        env:
          FEATURES: ${{ matrix.features }}
          PROFILE: release
        run: bash scripts/check_feature_matrix.sh
      - name: Lib tests for this feature set
        # shellcheck disable=SC2086
        run: cargo test --release --features ${{ matrix.features }} --lib
      - name: Parallel library tests
        if: matrix.features == 'capi,parallel'
        run: cargo test --lib --features parallel
