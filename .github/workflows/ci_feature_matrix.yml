name: Feature matrix (C ABI)

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - chemfiles-from-sources
          - chemfiles-from-sources,zstd
          - chemfiles-from-sources,metatensor
          - chemfiles-from-sources,zstd,metatensor
          - grammar
          - chemfiles-from-sources,grammar
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + symbol/header matrix
        env:
          FEATURES: ${{ matrix.features }}
          PROFILE: release
        run: bash scripts/check_feature_matrix.sh
      - name: Lib tests for this feature set
        # shellcheck disable=SC2086
        run: cargo test --release --features ${{ matrix.features }} --lib

  zstd:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install a C++ compiler that finds libstdc++
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Build with the zstd feature
        run: bash scripts/check_zstd_build.sh
