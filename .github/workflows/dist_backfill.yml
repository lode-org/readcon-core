# Attach cargo-dist archives to a GitHub Release that already exists.
#
# Run this from main. Actions loads this file from the selected ref, then
# the jobs check out inputs.tag for the source that was released. That split
# matters for a tag whose own release.yml failed before `dist host` uploaded
# anything: re-running the tag uses the workflow frozen on the tag.
#
# The build commands match .github/workflows/release.yml, so the archive
# names match. The upload set is the same one that workflow publishes after
# it deletes `*-dist-manifest.json`. crates.io and PyPI are other workflows
# and are not invoked here. This file does not create or move a tag.

name: Backfill cargo-dist assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose GitHub Release should receive cargo-dist archives
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dist-backfill-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      tag-flag: ${{ steps.plan.outputs.tag-flag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - name: Install dist
        shell: bash
        run: bash scripts/install-cargo-dist-ci.sh
      - name: Cache dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must be vX.Y.Z" >&2
            exit 1
          fi
          ver="$(tr -d '[:space:]' < VERSION)"
          if [[ "$RELEASE_TAG" != "v${ver}" ]]; then
            echo "VERSION is ${ver}, tag asks for ${RELEASE_TAG}" >&2
            exit 1
          fi
          # v0.23.0 has no msvc-crt-static. cargo-dist then uses the static
          # CRT and the Windows link fails on zlib-ng's __imp__wassert.
          if ! grep -Eq '^msvc-crt-static[[:space:]]*=' dist-workspace.toml; then
            tmp="$(mktemp)"
            awk '
              BEGIN { done = 0 }
              /^\[dist\]$/ && !done {
                print
                print "msvc-crt-static = false"
                done = 1
                next
              }
              { print }
              END { if (!done) exit 1 }
            ' dist-workspace.toml > "$tmp"
            mv "$tmp" dist-workspace.toml
          fi
          # Refuse before the matrix builds if the release is missing.
          # `gh release upload` does not create a release or a tag.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName >/dev/null
          dist plan --tag="$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          {
            echo "tag=${RELEASE_TAG}"
            echo "tag-flag=--tag=${RELEASE_TAG}"
            echo "manifest=$(jq -c "." plan-dist-manifest.json)"
          } >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          set -euo pipefail
          if command -v cargo > /dev/null 2>&1; then
            exit 0
          fi
          arch="$(uname -m)"
          case "$arch" in
            x86_64) triple=x86_64-unknown-linux-gnu; sha=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
            aarch64) triple=aarch64-unknown-linux-gnu; sha=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
            *) echo "unsupported arch $arch" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -sSf -o rustup-init \
            "https://static.rust-lang.org/rustup/archive/1.28.2/${triple}/rustup-init"
          echo "${sha}  rustup-init" | sha256sum -c -
          chmod +x rustup-init
          ./rustup-init -y --no-modify-path --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dist
        shell: bash
        run: bash scripts/install-cargo-dist-ci.sh
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Use the dynamic Windows CRT
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq '^msvc-crt-static[[:space:]]*=' dist-workspace.toml; then
            tmp="$(mktemp)"
            awk '
              BEGIN { done = 0 }
              /^\[dist\]$/ && !done {
                print
                print "msvc-crt-static = false"
                done = 1
                next
              }
              { print }
              END { if (!done) exit 1 }
            ' dist-workspace.toml > "$tmp"
            mv "$tmp" dist-workspace.toml
          fi
      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Use the dynamic Windows CRT
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq '^msvc-crt-static[[:space:]]*=' dist-workspace.toml; then
            tmp="$(mktemp)"
            awk '
              BEGIN { done = 0 }
              /^\[dist\]$/ && !done {
                print
                print "msvc-crt-static = false"
                done = 1
                next
              }
              { print }
              END { if (!done) exit 1 }
            ' dist-workspace.toml > "$tmp"
            mv "$tmp" dist-workspace.toml
          fi
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  upload:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ needs.plan.result == 'success' && needs.build-local-artifacts.result == 'success' && needs.build-global-artifacts.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.tag }}
          submodules: recursive
      # The checker has to be the one on the workflow ref. The tag that
      # failed still imports tomllib with no fallback and rejects the
      # per-target manifests the build jobs upload.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: packager
      - name: Install cached dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Merge the dist manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # GitHub hosting in dist 0.28 is done by this workflow, not by
          # `dist host`. These steps only write dist-manifest.json.
          dist host --tag="$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/dist-manifest.json
      - name: Require dist metadata to match the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 "$GITHUB_WORKSPACE/packager/scripts/check_release_artifacts.py" \
            --tag "$RELEASE_TAG" \
            --version-file "$GITHUB_WORKSPACE/VERSION" \
            --dist "$GITHUB_WORKSPACE/target/distrib" \
            --manifest "$GITHUB_WORKSPACE/target/distrib/plan-dist-manifest.json"
      - name: Upload cargo-dist assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for path in target/distrib/*; do
            name="$(basename "$path")"
            case "$name" in
              *-dist-manifest.json) continue ;;
            esac
            files+=("$path")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no cargo-dist assets to upload" >&2
            exit 1
          fi
          printf 'upload %s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
