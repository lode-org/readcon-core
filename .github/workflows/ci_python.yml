name: Python ReadCon

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
    paths:
      - 'src/**'
      - 'tests/python/**'
      - 'resources/test/**'
      - 'resources/conformance/**'
      - 'resources/examples/**'
      - 'addl/referenceImpls/eon_cpp/bench_con_reader.c'
      - 'bench/h2h/**'
      - 'bench/fidelity/**'
      - 'benches/**'
      - 'examples/**'
      - 'ase-readcon/**'
      - 'docs/source/**'
      - 'docs/orgmode/tutorial.org'
      - 'docs/orgmode/chemfiles-notebook.org'
      - 'docs/notebooks/**'
      - 'scripts/**'
      - 'packaging/wrapdb/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson_options.txt'
      - 'LICENSE'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'VERSION'
      - 'dist-workspace.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dist_backfill.yml'
      - '.github/workflows/cxx_tarball.yml'
      - '.github/workflows/c_lib_tarball.yml'
      - '.github/workflows/ci_julia.yml'
      - '.github/workflows/python_wheels.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci_python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/python/**'
      - 'resources/test/**'
      - 'resources/conformance/**'
      - 'resources/examples/**'
      - 'addl/referenceImpls/eon_cpp/bench_con_reader.c'
      - 'bench/h2h/**'
      - 'bench/fidelity/**'
      - 'benches/**'
      - 'examples/**'
      - 'ase-readcon/**'
      - 'docs/source/**'
      - 'docs/orgmode/tutorial.org'
      - 'docs/orgmode/chemfiles-notebook.org'
      - 'docs/notebooks/**'
      - 'scripts/**'
      - 'packaging/wrapdb/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson_options.txt'
      - 'LICENSE'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'VERSION'
      - 'dist-workspace.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dist_backfill.yml'
      - '.github/workflows/cxx_tarball.yml'
      - '.github/workflows/c_lib_tarball.yml'
      - '.github/workflows/ci_julia.yml'
      - '.github/workflows/python_wheels.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci_python.yml'
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    name: pytest (${{ matrix.features }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: python,zstd,borrow-path-counts,race-hooks
            name: lean
          - features: python,chemfiles-from-sources,zstd,race-hooks
            name: chemfiles
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install maturin, pytest, ase, emacs (org-babel)
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install maturin pytest numpy ase chemfiles 'MDAnalysis==2.11.0' 'gemmi==0.7.5' 'h5py==3.16.0' 'snakemake==8.30.0'
          .venv/bin/python -m pip install -e ase-readcon
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox zstd gfortran

      - name: maturin develop
        env:
          # match wheel CI: avoid mold breakage on some runners
          RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
        run: |
          maturin develop --features '${{ matrix.features }}'

      # Org Babel: tangle tutorial.org → docs/notebooks/tutorial_core.py and run
      - name: Org Babel One Good Tutorial
        run: |
          scripts/run-tutorial-core.sh

      # Org Babel: tangle chemfiles-notebook.org → chemfiles_ingress.py and run
      - name: Org Babel chemfiles notebook
        if: matrix.name == 'chemfiles'
        run: |
          scripts/run-chemfiles-notebook.sh

      - name: extxyz-ng prefix
        run: |
          bash bench/h2h/install_extxyz_ng.sh

      - name: pytest tests/python
        env:
          # A missing reader fails these runs instead of leaving its test empty.
          READCON_REQUIRE_ARMS: mda-pdb,mda-xyz,mda-dcd,mda-xtc,mda-ncdf,mda-trr,mda-h5md,mda-mmcif,extxyz-ng
        run: |
          # The clean-clone trace tests use the locked paper toolchain in ci_paper.yml.
          python -m pytest tests/python/ -q --tb=short \
            --ignore=tests/python/test_trace_check_clean_clone.py

  pytest-free-threaded:
    name: pytest free-threaded (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    env:
      # Free-threaded builds still start with the GIL unless this is set.
      PYTHON_GIL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13t"
            required-arms: mda-pdb,mda-xyz,mda-dcd,mda-xtc,mda-ncdf,mda-trr,mda-h5md
          - python-version: "3.14t"
            required-arms: mda-pdb,mda-xyz,mda-dcd,mda-xtc,mda-ncdf,mda-trr,mda-h5md,mda-mmcif
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install maturin + test deps
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -U pip
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox zstd gfortran zlib1g-dev libjpeg-dev libhdf5-dev libopenblas-dev pkg-config
          .venv/bin/python -m pip install maturin pytest numpy ase chemfiles 'MDAnalysis==2.11.0' 'h5py==3.16.0'
          .venv/bin/python -m pip install -e ase-readcon
          # A current rpds-py wheel installs on 3.13t. The version pip would
          # otherwise build does not: its PyO3 refuses a free-threaded
          # interpreter below 3.14, and that takes snakemake with it.
          .venv/bin/python -m pip install --only-binary=:all: rpds-py
          .venv/bin/python -m pip install 'snakemake==8.30.0'
          # gemmi 0.7.5 publishes a 3.14t wheel and no 3.13t wheel, and the
          # source build rejects the nanobind it is given. The 3.13t matrix
          # therefore omits mda-mmcif from its required reader arms.
          .venv/bin/python -m pip install 'gemmi==0.7.5' || echo "gemmi==0.7.5 did not install on this interpreter"

      - name: maturin develop
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
        run: |
          maturin develop --features 'python,zstd,race-hooks'

      - name: pytest tests/python
        env:
          # extxyz-ng 0.0.2 publishes only a cp310-abi3 wheel. Pip on a
          # free-threaded interpreter rejects it, and loading that extension
          # aborts the process. The matrix requires mmCIF only where gemmi
          # publishes a compatible wheel.
          READCON_REQUIRE_ARMS: ${{ matrix.required-arms }}
        run: |
          test "$PYTHON_GIL" = 0
          python - <<'PY'
          import sys
          probe = getattr(sys, "_is_gil_enabled", None)
          if probe is None or probe():
              raise SystemExit(f"GIL is enabled at runtime: {probe}")
          PY
          # The clean-clone trace tests use the locked paper toolchain in ci_paper.yml.
          python -m pytest tests/python/ -q --tb=short \
            --ignore=tests/python/test_trace_check_clean_clone.py

  paper-tags:
    name: paper tags
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Tags and commits named by the paper
        run: |
          python paper/cpc/scripts/gen_release.py --check
          python -m pytest tests/python/test_paper_revisions.py -q --tb=short
