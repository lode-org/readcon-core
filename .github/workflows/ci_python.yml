name: Python ReadCon

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
    paths:
      - 'src/**'
      - 'tests/python/**'
      - 'resources/test/**'
      - 'resources/conformance/**'
      - 'resources/examples/**'
      - 'addl/referenceImpls/eon_cpp/bench_con_reader.c'
      - 'bench/h2h/**'
      - 'bench/fidelity/**'
      - 'benches/**'
      - 'examples/**'
      - 'ase-readcon/**'
      - 'docs/source/**'
      - 'docs/orgmode/tutorial.org'
      - 'docs/orgmode/chemfiles-notebook.org'
      - 'docs/notebooks/**'
      - 'scripts/**'
      - 'packaging/wrapdb/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson_options.txt'
      - 'LICENSE'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'VERSION'
      - 'dist-workspace.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dist_backfill.yml'
      - '.github/workflows/cxx_tarball.yml'
      - '.github/workflows/c_lib_tarball.yml'
      - '.github/workflows/ci_julia.yml'
      - '.github/workflows/python_wheels.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci_python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/python/**'
      - 'resources/test/**'
      - 'resources/conformance/**'
      - 'resources/examples/**'
      - 'addl/referenceImpls/eon_cpp/bench_con_reader.c'
      - 'bench/h2h/**'
      - 'bench/fidelity/**'
      - 'benches/**'
      - 'examples/**'
      - 'ase-readcon/**'
      - 'docs/source/**'
      - 'docs/orgmode/tutorial.org'
      - 'docs/orgmode/chemfiles-notebook.org'
      - 'docs/notebooks/**'
      - 'scripts/**'
      - 'packaging/wrapdb/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson_options.txt'
      - 'LICENSE'
      - 'build.rs'
      - '.cargo/config.toml'
      - 'VERSION'
      - 'dist-workspace.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/dist_backfill.yml'
      - '.github/workflows/cxx_tarball.yml'
      - '.github/workflows/c_lib_tarball.yml'
      - '.github/workflows/ci_julia.yml'
      - '.github/workflows/python_wheels.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci_python.yml'
  workflow_dispatch:

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pytest:
    name: pytest (${{ matrix.features }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: python,zstd,borrow-path-counts
            name: lean
          - features: python,chemfiles-from-sources,zstd
            name: chemfiles
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install maturin, pytest, ase, emacs (org-babel)
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install maturin pytest numpy ase chemfiles 'MDAnalysis==2.11.0' 'gemmi==0.7.5' 'h5py==3.16.0' 'snakemake==8.30.0'
          .venv/bin/python -m pip install -e ase-readcon
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: maturin develop
        env:
          # match wheel CI: avoid mold breakage on some runners
          RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
        run: |
          maturin develop --features '${{ matrix.features }}'

      # Org Babel: tangle tutorial.org → docs/notebooks/tutorial_core.py and run
      - name: Org Babel One Good Tutorial
        run: |
          scripts/run-tutorial-core.sh

      # Org Babel: tangle chemfiles-notebook.org → chemfiles_ingress.py and run
      - name: Org Babel chemfiles notebook
        if: matrix.name == 'chemfiles'
        run: |
          scripts/run-chemfiles-notebook.sh

      - name: extxyz-ng prefix
        run: |
          bash bench/h2h/install_extxyz_ng.sh

      - name: pytest tests/python
        env:
          # A missing reader fails these runs instead of leaving its test empty.
          READCON_REQUIRE_ARMS: mda-pdb,mda-xyz,mda-dcd,mda-xtc,mda-ncdf,mda-trr,mda-h5md,mda-mmcif,extxyz-ng
        run: |
          python -m pytest tests/python/ -q --tb=short

  pytest-free-threaded:
    name: pytest free-threaded (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install maturin + test deps
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install maturin pytest numpy

      - name: maturin develop
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
        run: |
          maturin develop --features 'python,zstd'

      - name: free-threaded pytest smoke
        run: |
          python -m pytest tests/python/test_gil_free_threads.py tests/python/test_readcon.py::TestReadCon::test_read_con_file -q --tb=short

  paper-tags:
    name: paper tags
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Tags and commits named by the paper
        run: |
          python paper/cpc/scripts/gen_release.py --check
          python -m pytest tests/python/test_paper_revisions.py -q --tb=short
