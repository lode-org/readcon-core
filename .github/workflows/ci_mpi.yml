name: MPI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "perf/**"
      - "ci/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mpi:
    name: ${{ matrix.mpi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: mpich
            packages: mpich libmpich-dev
            cc: mpicc.mpich
            cxx: mpicxx.mpich
            probe: mpiexec.hydra
            # hydra is the MPICH PMI launcher. mpiexec.mpich is the same
            # binary; do not use the alternatives-default mpiexec, which
            # is Open MPI when both packages are installed.
            launcher: mpiexec.hydra -n
          - mpi: openmpi
            packages: openmpi-bin libopenmpi-dev
            cc: mpicc.openmpi
            cxx: mpicxx.openmpi
            probe: mpiexec.openmpi
            launcher: mpiexec.openmpi --oversubscribe -n
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install MPI and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }} libclang-dev clang
          bindir="${RUNNER_TEMP}/mpi-wrappers"
          mkdir -p "$bindir"
          ln -sfn "$(command -v ${{ matrix.cc }})" "$bindir/mpicc"
          ln -sfn "$(command -v ${{ matrix.cxx }})" "$bindir/mpicxx"
          echo "$bindir" >> "$GITHUB_PATH"
          ${{ matrix.probe }} --version | head -1
      - name: Default build has no MPI dependency
        run: |
          cargo tree -e normal --prefix none | grep -E '^mpi(-sys)? ' && exit 1 || true
      - name: Unit tests with the mpi feature
        run: cargo test --features mpi --lib distrib
      - name: Build Rust smoke test and C library
        run: |
          cargo build --features mpi --example mpi_smoke
          cargo build --lib
          ${{ matrix.cc }} -Wall -Wextra -Werror -Iinclude tests/c/test_mpi_shim.c \
            -Ltarget/debug -lreadcon_core -o target/test_mpi_shim
          ${{ matrix.cxx }} -fsyntax-only -Iinclude -x c++ include/readcon-core-mpi.h
      - name: Run on 1 to 4 ranks
        env:
          LD_LIBRARY_PATH: target/debug
        run: |
          for n in 1 2 3 4; do
            ${{ matrix.launcher }} $n target/debug/examples/mpi_smoke
            ${{ matrix.launcher }} $n target/test_mpi_shim
          done
