name: Basic tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: btest_rust-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  btest_rust:
    runs-on: ubuntu-22.04
    name: Run basic tests and build

    steps:
      - uses: actions/checkout@v6
        with:
          # check_version_sot.sh reads v0.23.2 and an older source_commit.
          # A depth-1 checkout has neither the tag nor that commit.
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.10.0"

      - name: Setup sccache environment
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install Meson, Ninja, Valgrind, OpenMPI, and Cap'n Proto
        run: |
          python -m pip install meson ninja
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valgrind libc6-dbg \
            openmpi-bin libopenmpi-dev libclang-dev clang \
            capnproto libcapnp-dev --fix-missing

      - name: C/C++ distribution gate
        run: bash scripts/check-cxx-dist.sh

      - name: Run Rust tests
        env:
          READCON_REQUIRE_TOOLS: "1"
        run: cargo test

      - name: Run Rust tests (C ABI)
        env:
          READCON_REQUIRE_TOOLS: "1"
        run: cargo test --features capi

      - name: Parallel library tests
        run: cargo test --lib --features parallel

      - name: Surface grammar (PEG companion)
        # grammar is optional (not on hot path); still gate PR lockstep with prose/spec.
        run: cargo test --features grammar --lib grammar

      - name: Parallel frame scans
        run: cargo test --features parallel --test frame_scan_whitespace

      - name: Page-aligned borrowed buffer
        run: cargo test --features parallel --test page_aligned_buffer

      - name: Build and test FFI bindings
        id: btest_rust
        run: |
          meson setup bbdir \
          -Dwith_tests=False \
          -Dwith_cpp=True \
          -Dwith_examples=True \
          --buildtype=release
          meson test -C bbdir --print-errorlogs \
          --wrap="valgrind --leak-check=full --show-leak-kinds=definite,indirect,possible --track-origins=yes --error-exitcode=1 --suppressions=$GITHUB_WORKSPACE/valgrind.supp --gen-suppressions=all"
