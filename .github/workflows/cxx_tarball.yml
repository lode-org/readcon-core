name: cxx source tarball

# Attaches readcon-core-cxx-$VERSION.tar.gz to the GitHub Release created
# by cargo-dist on a version tag. Consumers FetchContent / wrap this URL.
# cbindgen is not installed and not invoked.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cxx-tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble cxx tarball
        run: |
          mkdir -p dist-cxx
          bash scripts/package-cxx.sh dist-cxx --vendor
          ls -lh dist-cxx

      - name: Upload tarball to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-cxx/readcon-core-cxx-*.tar.gz
            dist-cxx/readcon-core-cxx-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            C/C++ source tarball (`readcon-core-cxx-*.tar.gz`) for CMake FetchContent and Meson wrap. Headers are pre-generated; cbindgen is not required.
