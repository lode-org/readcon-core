name: cxx source tarball

# Attaches slim + vendor cxx tarballs after cargo-dist publishes the
# GitHub Release. Slim URL is the FetchContent / wrapdb default.
# cbindgen is not installed and not invoked.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to checkout and attach cxx tarballs to
        required: true
        type: string

permissions:
  contents: write

jobs:
  cxx-tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble slim and vendor cxx tarballs
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist-cxx build-cxx/slim build-cxx/vendor
          bash scripts/package-cxx.sh build-cxx/slim
          bash scripts/package-cxx.sh build-cxx/vendor --vendor
          # Release assets are the two archives and their sha256 sidecars.
          # Wrap files stay in build-cxx so the vendor hash cannot replace
          # the slim wrap, and they are not uploaded.
          cp "build-cxx/slim/readcon-core-cxx-${ver}.tar.gz" dist-cxx/
          cp "build-cxx/slim/readcon-core-cxx-${ver}.tar.gz.sha256" dist-cxx/
          cp "build-cxx/vendor/readcon-core-cxx-${ver}-vendor.tar.gz" dist-cxx/
          cp "build-cxx/vendor/readcon-core-cxx-${ver}-vendor.tar.gz.sha256" dist-cxx/
          ls -lh dist-cxx build-cxx/slim build-cxx/vendor

      - name: Require tarball names to match the tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python3 scripts/check_release_artifacts.py --tag "$RELEASE_TAG" --dist dist-cxx

      - name: Upload tarballs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist-cxx/readcon-core-cxx-*.tar.gz
            dist-cxx/readcon-core-cxx-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            C/C++ source tarballs: `readcon-core-cxx-$VERSION.tar.gz` (FetchContent / wrap default) and `readcon-core-cxx-$VERSION-vendor.tar.gz` (offline crates). Headers are pre-generated; cbindgen is not required.
