name: cxx source tarball

# Attaches slim + vendor cxx tarballs after cargo-dist publishes the
# GitHub Release. Slim URL is the FetchContent / wrapdb default.
# cbindgen is not installed and not invoked.
on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to checkout and attach cxx tarballs to
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to checkout and attach cxx tarballs to
        required: true
        type: string

permissions:
  contents: write

jobs:
  cxx-tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Assemble slim and vendor cxx tarballs
        run: |
          mkdir -p dist-cxx
          bash scripts/package-cxx.sh dist-cxx
          bash scripts/package-cxx.sh dist-cxx --vendor
          ls -lh dist-cxx

      - name: Refuse to replace an existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-cxx/readcon-core-cxx-*.tar.gz dist-cxx/readcon-core-cxx-*.tar.gz.sha256)
          tag="${{ inputs.tag || github.ref_name }}"
          bash scripts/reject_existing_release_assets.sh "$tag" "${files[@]}"

      - name: Upload tarballs to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist-cxx/readcon-core-cxx-*.tar.gz
            dist-cxx/readcon-core-cxx-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            C/C++ source tarballs: `readcon-core-cxx-$VERSION.tar.gz` (FetchContent / wrap default) and `readcon-core-cxx-$VERSION-vendor.tar.gz` (offline crates). Headers are pre-generated; cbindgen is not required.
