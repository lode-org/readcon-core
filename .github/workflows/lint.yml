name: Lint

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Conventional commits check
      # A pull request checks base.sha..head.sha.
      # A push checks github.event.before..github.sha.
      # An all-zero before, or a before sha missing from the clone
      # (a rewritten push), starts at the merge-base with origin/main.
      # The script skips merge commits.
      env:
        RANGE_START: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        RANGE_END: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: bash scripts/check_conventional_commits.sh

    - name: Audit for large files
      # The v0.1.0 action mirror-clones every ref. fetch-depth 0 fetches
      # every branch, so paper/restore's generated claisen_wbo.pdf (1.74 MiB
      # and 1.71 MiB) failed this job on main, including at v0.21.0.
      # Those blobs are not reachable from this branch. Audit HEAD.
      run: bash scripts/audit_large_files.sh
