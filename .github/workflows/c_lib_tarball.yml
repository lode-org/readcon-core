name: C library tarball

# Prebuilt cargo-c prefixes for non-Python consumers (Julia / Fortran / C).
# Separate from python_wheels.yml so a C-lib miss cannot skip PyPI publish.
# Linux jobs reuse the wheel manylinux tricks: BFD linker, manylinux: auto.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/package-clib.sh'
      - '.github/workflows/c_lib_tarball.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to checkout and attach clib tarballs to
        required: false
        type: string

concurrency:
  group: c-lib-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: "cc"
  CARGO_C_VERSION: "v0.10.24"

jobs:
  clib:
    name: C lib ${{ matrix.variant }} (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Explicit rows only (no axis × include cartesian product).
      # Same runners as python_wheels.yml. Windows chemfiles is explicit:
      # official prebuilt libchemfiles, not chemfiles-from-sources.
      matrix:
        include:
          - variant: default
            os: ubuntu-24.04
            target: x86_64
            rust_target: x86_64-unknown-linux-gnu
            features: ''
          - variant: default
            os: ubuntu-24.04-arm
            target: aarch64
            rust_target: aarch64-unknown-linux-gnu
            features: ''
          - variant: default
            os: macos-15-intel
            target: x86_64
            rust_target: x86_64-apple-darwin
            features: ''
          - variant: default
            os: macos-15
            target: aarch64
            rust_target: aarch64-apple-darwin
            features: ''
          - variant: default
            os: windows-2022
            target: x86_64
            rust_target: x86_64-pc-windows-msvc
            features: ''
          - variant: chemfiles
            os: ubuntu-24.04
            target: x86_64
            rust_target: x86_64-unknown-linux-gnu
            features: chemfiles-from-sources
          - variant: chemfiles
            os: ubuntu-24.04-arm
            target: aarch64
            rust_target: aarch64-unknown-linux-gnu
            features: chemfiles-from-sources
          - variant: chemfiles
            os: macos-15-intel
            target: x86_64
            rust_target: x86_64-apple-darwin
            features: chemfiles
          - variant: chemfiles
            os: macos-15
            target: aarch64
            rust_target: aarch64-apple-darwin
            features: chemfiles
          # Official prebuilt libchemfiles for x86_64-pc-windows-msvc.
          # Do not use chemfiles-from-sources here (vendored zlib/CMake).
          - variant: chemfiles
            os: windows-2022
            target: x86_64
            rust_target: x86_64-pc-windows-msvc
            features: chemfiles
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # BFD is the stable manylinux linker. Apple clang rejects -fuse-ld=bfd.
      - name: Linux BFD linker
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=bfd" >> "$GITHUB_ENV"

      # chemfiles-sys 0.10.41 builds vendored zlib. cmake-rs 0.1.58 ignores
      # CMAKE_ARGS, so CHFL_SYSTEM_ZLIB never reached CMake. Old zconf.h does
      # `#define fdopen ...` unless HAVE_UNISTD_H; that breaks the MacOSX SDK
      # stdio.h. CFLAGS is forwarded by cmake-rs via the cc crate.
      - name: macOS chemfiles zlib vs SDK
        if: runner.os == 'macOS' && matrix.variant == 'chemfiles'
        run: |
          echo "CFLAGS=-DHAVE_UNISTD_H -DHAVE_FDOPEN" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-DHAVE_UNISTD_H -DHAVE_FDOPEN" >> "$GITHUB_ENV"

      # Official prebuilt libchemfiles.obj calls GetUserNameA (advapi32).
      # cmake-rs does not add that import lib for the prebuilt path.
      - name: Windows chemfiles link advapi32
        if: runner.os == 'Windows' && matrix.variant == 'chemfiles'
        shell: bash
        run: echo "RUSTFLAGS=-C link-arg=advapi32.lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-c
        if: runner.os != 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-c

      # manylinux: auto (same PyO3/maturin-action policy as python_wheels.yml).
      # before-script-linux runs cargo-c inside the container. `maturin build
      # --help` is a no-op so this job cannot emit a wheel artifact.
      - name: "Package C library (Linux, manylinux: auto)"
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          docker-options: >-
            -e CARGO_HTTP_MULTIPLEXING=false
            -e CARGO_NET_RETRY=10
            -e CARGO_HTTP_TIMEOUT=120
            -e CMAKE_POLICY_VERSION_MINIMUM=3.5
            -e RUSTFLAGS=-C link-arg=-fuse-ld=bfd
            -e CAPI_FEATURES=${{ matrix.features }}
            -e CAPI_VARIANT=${{ matrix.variant }}
            -e CAPI_TARGET=${{ matrix.rust_target }}
            -e CARGO_C_VERSION=${{ env.CARGO_C_VERSION }}
          before-script-linux: |
            set -euo pipefail
            mkdir -p "$HOME/.cargo/bin"
            CAPI_MUSL="$(printf '%s' "$CAPI_TARGET" | sed 's/gnu/musl/')"
            work="$(mktemp -d)"
            curl -fsSL \
              "https://github.com/lu-zero/cargo-c/releases/download/${CARGO_C_VERSION}/cargo-c-${CAPI_MUSL}.tar.gz" \
              | tar -xz -C "$work"
            find "$work" -type f \( -name 'cargo-c*' -o -name 'cargo-cinstall' \) -exec cp -a {} "$HOME/.cargo/bin/" \;
            chmod +x "$HOME/.cargo/bin"/cargo-c* || true
            export PATH="$HOME/.cargo/bin:$PATH"
            command -v cargo-cinstall
            bash scripts/package-clib.sh dist-clib \
              --features "${CAPI_FEATURES}" \
              --variant "${CAPI_VARIANT}" \
              --target "${CAPI_TARGET}"
          command: build
          args: --help

      - name: Package C library (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && matrix.variant == 'chemfiles' && '-C link-arg=advapi32.lib' || '' }}
          CFLAGS: ${{ (runner.os == 'macOS' && matrix.variant == 'chemfiles') && '-DHAVE_UNISTD_H -DHAVE_FDOPEN' || '' }}
          CXXFLAGS: ${{ (runner.os == 'macOS' && matrix.variant == 'chemfiles') && '-DHAVE_UNISTD_H -DHAVE_FDOPEN' || '' }}
        shell: bash
        run: |
          bash scripts/package-clib.sh dist-clib \
            --features "${{ matrix.features }}" \
            --variant "${{ matrix.variant }}" \
            --target "${{ matrix.rust_target }}"

      - name: List prefix tarball
        shell: bash
        run: ls -lh dist-clib

      - uses: actions/upload-artifact@v4
        with:
          name: clib-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.target }}
          path: |
            dist-clib/readcon-core-clib-*.tar.gz
            dist-clib/readcon-core-clib-*.tar.gz.sha256
          if-no-files-found: error

  github-release:
    name: Attach C lib tarballs to GitHub Release
    needs: [clib]
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) && needs.clib.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'clib-*'
          merge-multiple: true
          path: dist-clib/
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist-clib/readcon-core-clib-*.tar.gz
            dist-clib/readcon-core-clib-*.tar.gz.sha256
          fail_on_unmatched_files: true
          append_body: true
          body: |
            Prebuilt C library prefixes (`readcon-core-clib-$VERSION-$target-$variant.tar.gz`): cargo-c `cdylib` + `include/` + `lib/pkgconfig/readcon-core.pc`. Lean (`default`) and chemfiles-linked (`chemfiles`) on manylinux/macOS/Windows. Windows chemfiles uses the official prebuilt libchemfiles (not from-sources). Headers are pre-generated; cbindgen is not required. Julia: set `READCON_LIB_PATH` / `READCON_CORE_PREFIX`. Fortran: `PKG_CONFIG_PATH` + fpm against the system lib.
