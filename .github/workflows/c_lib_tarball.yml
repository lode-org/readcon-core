name: C ABI library tarball

# Prebuilt libreadcon_core + shipped headers + readcon-core.pc, attached
# to a GitHub Release. cbindgen is not installed and not invoked.
#
# Attach-to-tag: workflow_dispatch inputs.tag works like cxx_tarball.yml so
# an already-published tag (v0.14.7) can receive clib assets later.
# The packager (scripts/package-clib.sh and scripts/upload-release-assets.sh)
# comes from the workflow ref. Sources and the Release tag come from
# inputs.tag (dispatch) or github.ref (v* tag push). That split is required
# because v0.14.7 does not contain package-clib.sh.
#
# Do not trigger on the release event. cargo-dist runs `gh release create`
# with GITHUB_TOKEN, and events from that token do not start workflows. The
# release event last started this workflow on v0.14.9, when a person
# published the release. A v* tag push starts it alongside crates.io,
# cargo-dist, and the wheel workflow.
#
# The upload waits until that Release exists, then runs
# `gh release upload --clobber`. It does not create a release, move a tag,
# or publish crates or wheels. workflow_dispatch input `tag` backfills an
# existing release the same way, without waiting and without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose GitHub Release should receive clib tarballs
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clib-tarball-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  clib-tarball:
    name: clib ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: chemfiles-from-sources,parallel
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: chemfiles-from-sources,parallel
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            features: parallel
            manylinux_image: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            features: chemfiles,parallel
          - os: macos-15
            target: aarch64-apple-darwin
            features: chemfiles,parallel
          # Windows + chemfiles is not a clib asset. See windows-chemfiles-skip.
    steps:
      - name: Checkout packager (workflow ref; has package-clib.sh)
        uses: actions/checkout@v6
        with:
          path: packager
          persist-credentials: false

      - name: Checkout tag sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          path: src
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # BSD tar rejects GNU --sort=name. gtar is GNU tar; reproducible-tar.sh
      # uses it, and falls back to a sorted file list when it is absent.
      - name: Install GNU tar
        if: runner.os == 'macOS'
        shell: bash
        run: brew install gnu-tar

      # The published Windows archive has empty uname and no pax headers,
      # which is GNU tar --numeric-owner. bsdtar on Windows writes atime
      # and ctime into pax headers and the bytes move.
      - name: Require GNU tar on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if ! tar --version 2>&1 | head -n 1 | grep -q 'GNU tar'; then
            echo "Windows clib archives need GNU tar" >&2
            tar --version >&2 || true
            exit 1
          fi

      # Host gitconfig does not enter the manylinux container. That job
      # marks /io, /io/src, and /io/packager inside the container as well.
      - name: Mark checkouts as safe git directories
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/packager"

      - name: Linux BFD linker
        if: runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-fuse-ld=bfd" >> "$GITHUB_ENV"

      # chemfiles-sys 0.10.41 builds vendored zlib. cmake-rs 0.1.58 ignores
      # CMAKE_ARGS, so CHFL_SYSTEM_ZLIB never reached CMake. Old zconf.h does
      # `#define fdopen ...` unless HAVE_UNISTD_H; that breaks the MacOSX SDK
      # stdio.h. CFLAGS is forwarded by cmake-rs via the cc crate.
      - name: macOS chemfiles zlib vs SDK
        if: runner.os == 'macOS'
        run: |
          echo "CFLAGS=-DHAVE_UNISTD_H -DHAVE_FDOPEN" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-DHAVE_UNISTD_H -DHAVE_FDOPEN" >> "$GITHUB_ENV"

      - name: Assemble clib tarball (manylinux_2_28)
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=bfd"
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
          CARGO_FEATURES: ${{ matrix.features }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p src/.ci-cargo src/.ci-rustup src/target-manylinux dist-clib
          docker run --rm \
            -e RUSTFLAGS \
            -e CARGO_FEATURES \
            -e CARGO_TARGET \
            -e CARGO_HTTP_MULTIPLEXING \
            -e CARGO_NET_RETRY \
            -e CARGO_HTTP_TIMEOUT \
            -e CMAKE_POLICY_VERSION_MINIMUM \
            -e CARGO_HOME=/io/src/.ci-cargo \
            -e RUSTUP_HOME=/io/src/.ci-rustup \
            -e CARGO_TARGET_DIR=/io/src/target \
            -v "$GITHUB_WORKSPACE":/io \
            -w /io/src \
            "$MANYLINUX_IMAGE" \
            bash -lc '
              set -euo pipefail
              if command -v git >/dev/null 2>&1; then
                git config --global --add safe.directory /io
                git config --global --add safe.directory /io/src
                git config --global --add safe.directory /io/packager
              fi
              export PATH="/io/src/.ci-cargo/bin:$PATH"
              if ! command -v rustc >/dev/null 2>&1; then
                curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
                export PATH="/io/src/.ci-cargo/bin:$PATH"
              fi
              feat_args=()
              if [ -n "${CARGO_FEATURES:-}" ]; then
                feat_args=(--features "${CARGO_FEATURES}")
              fi
              bash /io/packager/scripts/package-clib.sh /io/dist-clib \
                --root /io/src \
                --target "${CARGO_TARGET}" \
                "${feat_args[@]}"
            '
          ls -lh dist-clib

      - name: Assemble clib tarball (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          CARGO_FEATURES: ${{ matrix.features }}
        run: |
          mkdir -p dist-clib
          feat_args=()
          if [ -n "${CARGO_FEATURES}" ]; then
            feat_args=(--features "${CARGO_FEATURES}")
          fi
          bash packager/scripts/package-clib.sh dist-clib \
            --root src \
            --target ${{ matrix.target }} \
            "${feat_args[@]}"
          ls -lh dist-clib

      # Windows links twice from an empty target directory. /Brepro and the
      # path remap live in package-clib.sh; a cache hit would hide a linker
      # timestamp. Linux and macOS pack the libraries just built a second
      # time, which checks the tar header without another compile.
      - name: Prove the clib tarball is reproducible
        shell: bash
        env:
          CARGO_FEATURES: ${{ matrix.features }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist-clib-rebuild
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -rf src/target
            feat_args=()
            if [ -n "${CARGO_FEATURES:-}" ]; then
              feat_args=(--features "${CARGO_FEATURES}")
            fi
            bash packager/scripts/package-clib.sh dist-clib-rebuild \
              --root src \
              --target "$CARGO_TARGET" \
              "${feat_args[@]}"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            docker run --rm \
              -e CARGO_TARGET \
              -v "$GITHUB_WORKSPACE":/io \
              -w /io \
              "$MANYLINUX_IMAGE" \
              bash -lc 'bash /io/packager/scripts/package-clib.sh /io/dist-clib-rebuild --root /io/src --target "$CARGO_TARGET" --no-build'
          else
            bash packager/scripts/package-clib.sh dist-clib-rebuild \
              --root src \
              --target "$CARGO_TARGET" \
              --no-build
          fi
          shopt -s nullglob
          first=(dist-clib/readcon-core-clib-*.tar.gz)
          second=(dist-clib-rebuild/readcon-core-clib-*.tar.gz)
          if [ "${#first[@]}" -ne 1 ] || [ "${#second[@]}" -ne 1 ]; then
            echo "expected one clib tarball in each directory" >&2
            exit 1
          fi
          python3 packager/scripts/compare-repro-archives.py "${first[0]}" "${second[0]}"

      - name: Require clib names to match the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # packager/ is the workflow ref. src/ is the tag that was packed.
          # VERSION has to be the packed tree, and the script has to be the
          # packager copy. Both paths are absolute so the workspace root,
          # which has neither scripts/ nor VERSION, is not the lookup root.
          # A Git Bash /d/a path loses its drive letter in Windows pathlib.
          # cygpath -w yields D:\a\... . ${GITHUB_WORKSPACE} is already that
          # native path when the runner set it; cygpath covers a POSIX copy.
          native() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -w "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          python3 "$(native "$GITHUB_WORKSPACE/packager/scripts/check_release_artifacts.py")" \
            --tag "$RELEASE_TAG" \
            --version-file "$(native "$GITHUB_WORKSPACE/src/VERSION")" \
            --dist "$(native "$GITHUB_WORKSPACE/dist-clib")"

      - name: Upload tarball to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          UPLOAD_WAIT: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/packager/scripts/upload-release-assets.sh"
          # Unmatched globs stay literal, and the uploader rejects those paths.
          set -- dist-clib/readcon-core-clib-*.tar.gz \
            dist-clib/readcon-core-clib-*.tar.gz.sha256 \
            dist-clib/Artifacts-*.toml
          for asset in "$@"; do
            if [ ! -f "$asset" ]; then
              echo "missing clib asset: $asset" >&2
              exit 1
            fi
          done
          if [ "$UPLOAD_WAIT" = "true" ]; then
            bash "$script" --tag "$RELEASE_TAG" --wait "$@"
          else
            bash "$script" --tag "$RELEASE_TAG" --backfill "$@"
          fi

  # Explicit skip: do not silently omit Windows chemfiles from the matrix.
  # Official prebuilt libchemfiles for x86_64-pc-windows-msvc is the Python
  # wheel path (python_wheels.yml, RUSTFLAGS advapi32.lib). Julia/Fortran
  # consume the manylinux/macOS tarballs from clib-tarball.
  windows-chemfiles-skip:
    name: Windows chemfiles (explicit skip)
    runs-on: ubuntu-22.04
    steps:
      - name: Record skip
        run: |
          echo "Windows + chemfiles is not a clib Release asset."
          echo "Use python_wheels.yml (prebuilt libchemfiles + advapi32) for Windows chemfiles."
          echo "Julia/Fortran consume manylinux/macOS readcon-core-clib-\$VER-\$target.tar.gz."
          echo "Attach-to-tag: Actions → C ABI library tarball → tag=vX.Y.Z on main."
