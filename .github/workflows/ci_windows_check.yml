name: Windows feature checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-gnu-check:
    name: windows-gnu (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            features: ""
          - name: test-hooks
            features: "test-hooks"
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: cargo check
        run: |
          if [[ -n "${{ matrix.features }}" ]]; then
            cargo check --target x86_64-pc-windows-gnu --features "${{ matrix.features }}"
          else
            cargo check --target x86_64-pc-windows-gnu
          fi
