name: Benchmark PR
concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "benchmarks/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "asv.conf.json"
      - ".github/workflows/ci_benchmark.yml"
      - ".github/workflows/ci_bench_commenter.yml"

jobs:
  # One job builds and measures base and head on the same runner.
  # Snakemake only launches asv. Timings are asv. Memory is asv_bench_memray.
  asv-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.16"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.6"

      - name: Install exact build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'cmake=3.22.1-1ubuntu1.22.04.2' \
            'gcc=4:11.2.0-1ubuntu1' \
            'g++=4:11.2.0-1ubuntu1' \
            'gcc-11=11.4.0-1ubuntu1~22.04.3' \
            'g++-11=11.4.0-1ubuntu1~22.04.3' \
            'make=4.3-4.1build1'

      - name: Install pinned benchmark tools
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r benchmarks/workflow/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run ASV via Snakemake
        run: |
          snakemake -s benchmarks/workflow/Snakefile --cores 1 \
            --config base="${{ github.event.pull_request.base.sha }}" \
                     head="${{ github.event.pull_request.head.sha }}"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: benchmark-results
          path: |
            results/comparison.txt
            results/metadata.txt
            results/row-bounds.txt
            results/regression-threshold-time.txt
            results/regression-threshold-memory.txt
            results/commenter-decision.txt
            results/aa-noise.json
            results/asv-continuous.txt
            results/calls.tsv
          retention-days: 7
