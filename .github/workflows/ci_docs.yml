name: Documentation

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Run the documented Python and C examples
        env:
          CC: gcc
          CXX: g++
          LIBRARY_PATH: /usr/lib/gcc/x86_64-linux-gnu/13
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: bash scripts/run_doc_examples.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          environments: docs

      - name: Add cargo bin to PATH
        run: echo "${{ runner.temp }}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build documentation
        run: pixi r -e docs docbld
        env:
          CARGO_HOME: ${{ runner.temp }}/.cargo


      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2

      - name: Link check (lychee)
        run: lychee --config lychee.toml 'docs/build/**/*.html'

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # The Pages API intermittently answers "Deployment failed, try again
      # later"; one delayed retry clears it without a manual re-run.
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
