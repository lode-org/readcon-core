name: cxx wrap pin

# Rebuild the slim cxx archive on every push and pull request and fail when
# packaging/wrapdb still names the previous tree. bench/** and paper/** do
# not enter the archive, so a campaign-only or paper-only change does not run
# this job.
on:
  push:
    branches:
      - main
    tags:
      - '**'
    paths-ignore:
      - 'bench/**'
      - 'paper/**'
  pull_request:
    paths-ignore:
      - 'bench/**'
      - 'paper/**'
  workflow_dispatch:

concurrency:
  group: cxx-wrap-pin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cxx-wrap-pin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0

      - name: Compare the wrap pin on a pull request
        if: github.event_name == 'pull_request'
        env:
          CC: gcc
          CXX: g++
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: bash scripts/check_cxx_wrap_pin.sh --pull-request

      - name: Compare the wrap pin on a protected ref
        if: github.event_name != 'pull_request'
        env:
          CC: gcc
          CXX: g++
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: bash scripts/check_cxx_wrap_pin.sh --strict
