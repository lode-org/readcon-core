# Copyright (c) readcon-core developers
name: Paper

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "ci/**"
    paths:
      - "paper/cpc/**"
      - "tests/python/test_trace_check_clean_clone.py"
      - ".github/workflows/ci_paper.yml"
  pull_request:
    paths:
      - "paper/cpc/**"
      - "tests/python/test_trace_check_clean_clone.py"
      - ".github/workflows/ci_paper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The paper names the measured candidate commit (an ancestor far
          # below this tip) and release tags. gen_release.py refuses a commit
          # the clone does not hold, so a shallow checkout fails the regen.
          fetch-depth: 0
          fetch-tags: true

      - name: Install Emacs and pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox pandoc

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          manifest-path: paper/cpc/pixi.toml
          cache: true

      - name: Install Tectonic 0.17.0
        run: |
          curl -fsSL -o tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf tectonic.tar.gz tectonic
          sudo install -m 755 tectonic /usr/local/bin/tectonic
          rm -f tectonic.tar.gz tectonic
          tectonic --version

      - name: Build readcon and the C ABI
        run: |
          pixi run --locked --manifest-path paper/cpc/pixi.toml cpc-readcon
          pixi run --locked --manifest-path paper/cpc/pixi.toml cpc-clib

      - name: Run the figure and record producer tests
        run: pixi run --locked --manifest-path paper/cpc/pixi.toml pytest tests/python/test_figure_producers.py tests/python/test_record_producers.py paper/cpc/tests

      - name: Check paper trace regeneration
        run: pixi run --locked --manifest-path paper/cpc/pixi.toml pytest tests/python/test_trace_check_clean_clone.py

      - name: Check live clause coverage regeneration
        run: python3 paper/cpc/scripts/clause_coverage.py --check

      - name: Regenerate the paper from the committed records
        run: pixi run --locked --manifest-path paper/cpc/pixi.toml cpc-regen

      - name: Check regenerated files are committed
        run: git diff --exit-code

      - name: Typeset with Tectonic
        run: pixi run --locked --manifest-path paper/cpc/pixi.toml cpc-tex-tectonic

      - name: Every included figure exists
        run: python3 paper/cpc/scripts/check_figures.py
