name = "ReadCon"
# [[[cog exec(open("scripts/cog_inline.py").read()); emit(cog, 'version = "{v}"')]]]
version = "0.20.0"
# [[[end]]]
license = "MIT"
author = "LODE developers"
maintainer = "LODE developers"
copyright = "2025-present LODE developers"
description = "Fortran ISO_C_BINDING bindings for readcon-core (CON/convel I/O)"

[library]
source-dir = "src"

[build]
auto-tests = true
auto-examples = true
link = ["readcon_core"]

[install]
library = true

[[test]]
name = "test_read_con"
source-dir = "test"
main = "test_read_con.f90"

[[test]]
name = "test_add_atom_roundtrip"
source-dir = "test"
main = "test_add_atom_roundtrip.f90"

[[test]]
name = "test_add_atom_restart"
source-dir = "test"
main = "test_add_atom_restart.f90"

[[test]]
name = "test_add_atom_frame"
source-dir = "test"
main = "test_add_atom_frame.f90"

[[test]]
name = "test_conformance_goldens"
source-dir = "test_conformance"
main = "test_conformance_goldens.f90"

[[example]]
name = "read_first"
source-dir = "example"
main = "read_first.f90"

[[example]]
name = "print_neb_band"
source-dir = "example"
main = "print_neb_band.f90"
